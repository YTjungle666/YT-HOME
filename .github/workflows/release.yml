name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SING_BOX_VERSION: "1.13.5"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ensure-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          prerelease: false

  build-linux:
    needs: ensure-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Docker Buildx
        run: |
          docker buildx version
          docker buildx create --use --name yt-home-release-builder

      - name: Export runtime filesystem
        run: |
          rm -rf "$RUNNER_TEMP/export"
          docker buildx build \
            --platform linux/amd64 \
            --build-arg SING_BOX_VERSION="${{ env.SING_BOX_VERSION }}" \
            --output "type=local,dest=$RUNNER_TEMP/export" \
            -f Dockerfile \
            .

      - name: Assemble release bundle
        run: |
          rm -rf YT-HOME
          mkdir -p YT-HOME/packaging/openrc
          cp "$RUNNER_TEMP/export/app/YTHOME" YT-HOME/
          cp "$RUNNER_TEMP/export/app/sing-box" YT-HOME/
          cp -R "$RUNNER_TEMP/export/app/web" YT-HOME/
          cp -R "$RUNNER_TEMP/export/app/migrations" YT-HOME/
          cp packaging/openrc/YTHOME YT-HOME/packaging/openrc/
          cp YT-HOME.service YT-HOME/
          cp YT-HOME.sh YT-HOME/
          cp install.sh YT-HOME/
          chmod +x YT-HOME/YTHOME YT-HOME/sing-box YT-HOME/YT-HOME.sh YT-HOME/install.sh YT-HOME/packaging/openrc/YTHOME
          tar -zcf YT-HOME-linux-amd64.tar.gz YT-HOME

      - name: Assemble CT rootfs bundle
        run: |
          tar -C "$RUNNER_TEMP/export" -zcf yt-home-ct-amd64-rootfs.tar.gz .

      - name: Upload linux artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: YT-HOME-linux-amd64
          path: ./YT-HOME-linux-amd64.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Upload CT rootfs artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: yt-home-ct-amd64-rootfs
          path: ./yt-home-ct-amd64-rootfs.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Upload linux asset to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: YT-HOME-linux-amd64.tar.gz
          asset_name: YT-HOME-linux-amd64.tar.gz
          prerelease: false
          overwrite: true

      - name: Upload CT rootfs asset to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: yt-home-ct-amd64-rootfs.tar.gz
          asset_name: yt-home-ct-amd64-rootfs.tar.gz
          prerelease: false
          overwrite: true
